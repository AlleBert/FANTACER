name: CI

on:
  # Full E2E: su push (master/develop) e manuale. Le PR sono coperte dal
  # "Vote security gate" (workflow separato, più veloce). Così i due workflow
  # non si contendono la stessa concurrency il giorno stesso della PR.
  push:
    branches: [master, develop]

  workflow_dispatch:

# Serializza i job E2E: il dataset Supabase fantacer-e2e è condiviso e il
# seed/cleanup (globalSetup/globalTeardown) non è idempotente sotto concorrenza.
concurrency:
  group: e2e-suite
  cancel-in-progress: false

env:
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL_TEST }}
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY_TEST }}

jobs:
  quality:
    name: Lint · Typecheck · Test · Build · E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: TypeScript check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: E2E tests
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY_TEST }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL_TEST }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD_TEST }}
          E2E_ADMIN_TOTP_SECRET: ${{ secrets.E2E_ADMIN_TOTP_SECRET_TEST }}
          E2E_VIEWER_EMAIL: ${{ secrets.E2E_VIEWER_EMAIL_TEST }}
          E2E_VIEWER_PASSWORD: ${{ secrets.E2E_VIEWER_PASSWORD_TEST }}
          # Rate-limit DB-backed (default 10 login / 5 verify per 15min): i
          # worker paralleli condividono IP+factorId; margine per workers>1 e retries.
          ADMIN_LOGIN_RATE_MAX: 100
          ADMIN_MFA_VERIFY_RATE_MAX: 100
        run: npm run test:e2e
